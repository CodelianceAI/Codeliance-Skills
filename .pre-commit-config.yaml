repos:
  - repo: local
    hooks:
      - id: check-sources-tests
        name: check-sources test suite
        entry: bash plugins/c4-architecture/tests/test-check-sources.sh
        language: system
        pass_filenames: false
        files: >-
          (?x)^plugins/c4-architecture/(
            scripts/check-(sources\.sh|ast\.py)
            |tests/
          )
      - id: continue-session-tests
        name: continue-session validate and test suite
        entry: bash -c 'claude plugin validate plugins/continue-session && claude plugin test plugins/continue-session'
        language: system
        pass_filenames: false
        files: ^plugins/continue-session/
